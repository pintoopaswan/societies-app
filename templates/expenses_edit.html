{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3 class="section-title">Edit Expense</h3>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="existing_bill_path" value="{{ row.bill_image_path or '' }}" />
    <div class="form-grid-6">
      <div>
        <label>Transaction Date</label>
        <input type="date" name="transaction_date" value="{{ transaction_date_iso }}" required />
      </div>
      <div>
        <label>Item Name</label>
        <input type="text" name="item_name" value="{{ row.item_name }}" required />
      </div>
      <div>
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" value="{{ '%.2f'|format(row.amount or 0) }}" required />
      </div>
      <div>
        <label>Payment Mode</label>
        <select name="payment_mode">
          <option value="" {% if not row.payment_mode %}selected{% endif %}>Select Mode</option>
          <option value="CASH" {% if (row.payment_mode or '')|upper == 'CASH' %}selected{% endif %}>CASH</option>
          <option value="ONLINE" {% if (row.payment_mode or '')|upper == 'ONLINE' %}selected{% endif %}>ONLINE</option>
          <option value="CHEQUE" {% if (row.payment_mode or '')|upper == 'CHEQUE' %}selected{% endif %}>CHEQUE</option>
        </select>
      </div>
      <div>
        <label>Paid By</label>
        <input type="text" name="paid_by" value="{{ row.paid_by or '' }}" />
      </div>
      <div>
        <label>Replace Bill</label>
        <input type="file" name="bill" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf" />
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; margin-top:12px; gap:10px; flex-wrap:wrap;">
      <div>
        {% if row.bill_image_path %}
          <a href="{{ url_for('static', filename=row.bill_image_path) }}" target="_blank">View Existing Bill</a>
        {% endif %}
      </div>
      <div style="display:flex; gap:10px;">
        <a href="{{ url_for('expenses') }}" class="btn" style="width:auto; text-decoration:none; padding:10px 14px; background:linear-gradient(135deg,#64748b 0%, #475569 100%);">Cancel</a>
        <button type="submit" style="width:auto; padding:10px 14px;">Save Changes</button>
        <button type="submit" name="action" value="delete" style="width:auto; padding:10px 14px; background:linear-gradient(135deg,#ef4444 0%, #dc2626 100%);" onclick="return confirm('Delete this expense record?');">Delete</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
