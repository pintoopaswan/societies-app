{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3 class="section-title">Add Payment Entry</h3>
  <form method="post">
    <div class="card" style="margin-bottom: 12px;">
      <h4 style="margin: 0 0 10px; font-size: 15px; color: #334155;">Flat & Billing Period</h4>
      <div class="form-grid-6">
        <div>
          <label>Block</label>
          <input name="block" list="block-list" placeholder="Select Block" required />
          <datalist id="block-list">{% for b in blocks %}<option value="{{ b }}"></option>{% endfor %}</datalist>
        </div>
        <div>
          <label>Flat</label>
          <input name="flat" list="flat-list" placeholder="Select Flat" required />
          <datalist id="flat-list">{% for f in allowed_flats %}<option value="{{ f }}"></option>{% endfor %}</datalist>
        </div>
        <div><label>Year</label><select name="year">{% for y in years %}<option value="{{ y }}">{{ y }}</option>{% endfor %}</select></div>
        <div><label>Month</label><select name="month">{% for m in range(1,13) %}<option value="{{ m }}">{{ months[m-1] }}</option>{% endfor %}</select></div>
        <div><label>Amount</label><input type="number" step="0.01" name="amount" placeholder="Enter Amount" required /></div>
        <div>
          <label>Mode Of Payment</label>
          <select name="mode_of_payment" id="mode_of_payment" required>
            <option value="">Select Payment Mode</option>
            <option value="ONLINE">ONLINE</option>
            <option value="CASH">CASH</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 12px;">
      <h4 style="margin: 0 0 10px; font-size: 15px; color: #334155;">Additional Details</h4>
      <div class="form-grid-3">
        <div><label>Payment Date</label><input type="date" name="payment_date" value="{{ today_iso }}" /></div>
        <div id="receivedByWrap" style="display:none;"><label>Received By</label><input name="received_by" id="received_by" placeholder="Receiver name (for cash)" /></div>
        <div><label>Notes</label><textarea name="notes" rows="2" placeholder="Optional remarks"></textarea></div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">
        <a href="{{ url_for('entry') }}" class="btn" style="width:auto; text-decoration:none; padding:10px 14px; background:linear-gradient(135deg,#64748b 0%, #475569 100%);">Cancel</a>
        <button type="submit" style="width:auto; padding:10px 14px;">Save Payment Entry</button>
      </div>
    </div>
  </form>
</div>
<script>
const modeEl = document.getElementById("mode_of_payment");
const receivedWrapEl = document.getElementById("receivedByWrap");
function toggleReceivedBy() {
  const isCash = (modeEl.value || "").toUpperCase() === "CASH";
  receivedWrapEl.style.display = isCash ? "block" : "none";
}
modeEl.addEventListener("change", toggleReceivedBy);
toggleReceivedBy();
</script>
{% endblock %}
