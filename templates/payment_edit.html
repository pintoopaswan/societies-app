{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3 class="section-title">Edit Payment Details</h3>
  <p style="margin: 0 0 12px; color: #64748b; font-size: 14px;">Update details for <b>{{ row.block }} / {{ row.flat }}</b> for <b>{{ months[month-1] }} {{ year }}</b>.</p>

  <form method="post" action="{{ url_for('edit_payment', property_id=row.id, year=year, month=month) }}">
    <input type="hidden" name="return_to" value="{{ return_to }}" />

    <div class="form-grid-6" style="margin-bottom: 12px;">
      <div>
        <label>Block</label>
        <input value="{{ row.block }}" disabled />
      </div>
      <div>
        <label>Flat</label>
        <input name="flat" list="flat-list" value="{{ row.flat }}" required />
        <datalist id="flat-list">
          {% for f in allowed_flats %}<option value="{{ f }}"></option>{% endfor %}
        </datalist>
      </div>
      <div>
        <label>Year</label>
        <input value="{{ year }}" disabled />
      </div>
      <div>
        <label>Month</label>
        <input value="{{ months[month-1] }}" disabled />
      </div>
      <div>
        <label>Status</label>
        <select name="status">
          <option value="DONE" {% if payment and (payment.status or '').upper() == 'DONE' %}selected{% endif %}>DONE</option>
          <option value="PENDING" {% if not payment or (payment.status or '').upper() == 'PENDING' %}selected{% endif %}>PENDING</option>
          <option value="LOCKED" {% if payment and (payment.status or '').upper() == 'LOCKED' %}selected{% endif %}>LOCKED</option>
        </select>
      </div>
      <div>
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" value="{{ '%.0f'|format(payment.amount) if payment else '0' }}" required />
      </div>
    </div>

    <div class="form-grid-3">
      <div>
        <label>Payment Date</label>
        <input type="date" name="payment_date" value="{{ payment_date_iso }}" />
      </div>
      <div>
        <label>Mode Of Payment</label>
        <select name="mode_of_payment" id="mode_of_payment">
          <option value="">Select Payment Mode</option>
          <option value="ONLINE" {% if payment and (payment.mode_of_payment or '')|upper == 'ONLINE' %}selected{% endif %}>ONLINE</option>
          <option value="CASH" {% if payment and (payment.mode_of_payment or '')|upper == 'CASH' %}selected{% endif %}>CASH</option>
        </select>
      </div>
      <div>
        <label>Notes</label>
        <textarea name="notes" rows="2">{{ payment.notes if payment and payment.notes else '' }}</textarea>
      </div>
    </div>
    <div id="receivedByWrap" style="margin-top:10px; display:none;">
      <label>Received By</label>
      <input name="received_by" id="received_by" value="{{ received_by or '' }}" placeholder="Receiver name" />
    </div>
    <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
      <button type="submit">Save Changes</button>
    </div>

    <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
      <button type="submit" name="action" value="delete" style="width:auto; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);" onclick="return confirm('Delete this payment entry? This cannot be undone.');">
        Delete Payment
      </button>
    </div>
  </form>

  <div style="margin-top: 12px;">
    <a href="{{ return_to }}" class="btn" style="display:inline-block; text-decoration:none; width:auto; padding:10px 14px;">Back</a>
  </div>
</div>
<script>
const modeEl = document.getElementById("mode_of_payment");
const receivedWrapEl = document.getElementById("receivedByWrap");
function toggleReceivedBy() {
  const isCash = (modeEl.value || "").toUpperCase() === "CASH";
  receivedWrapEl.style.display = isCash ? "block" : "none";
}
modeEl.addEventListener("change", toggleReceivedBy);
toggleReceivedBy();
</script>
{% endblock %}
