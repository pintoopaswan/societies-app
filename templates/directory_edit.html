{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3 class="section-title">Edit Directory Record</h3>
  <form method="post">
    <div style="display:grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 12px;">
      {% for k, v in record.items() %}
      <div>
        <label>{{ k }}</label>
        <input type="text" name="{{ k }}" value="{{ v }}" />
      </div>
      {% endfor %}
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:12px;">
      <a href="{{ url_for('directory') }}" class="btn" style="width:auto; text-decoration:none; padding:10px 14px; background:linear-gradient(135deg,#64748b 0%, #475569 100%);">Cancel</a>
      <button type="submit" style="width:auto; padding:10px 14px;">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
