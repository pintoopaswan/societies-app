{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3 class="section-title">Resident Directory</h3>
  <form method="get" class="form-grid" style="grid-template-columns: 1fr 180px;">
    <div>
      <label>Search Owner/Tenant Data</label>
      <input type="text" name="search" value="{{ search }}" placeholder="name / mobile / vehicle" />
    </div>
    <div><button type="submit">Apply Filter</button></div>
  </form>
</div>

<div class="card table-card">
  <table>
    <thead>
      <tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}<th>Action</th></tr>
    </thead>
    <tbody>
      {% for row in data %}
      <tr>
        {% for h in headers %}<td>{{ row.get(h, '') }}</td>{% endfor %}
        <td><a href="{{ url_for('directory_edit', row_id=row.get('_id')) }}" style="font-weight:700;">✏️ Edit</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
