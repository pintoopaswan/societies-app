{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3 class="section-title">Add Expense</h3>
  <form method="post" enctype="multipart/form-data">
    <div class="form-grid-6">
      <div>
        <label>Transaction Date</label>
        <input type="date" name="transaction_date" value="{{ today_iso }}" required />
      </div>
      <div>
        <label>Item Name</label>
        <input type="text" name="item_name" placeholder="Item / service" required />
      </div>
      <div>
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" placeholder="Amount" required />
      </div>
      <div>
        <label>Payment Mode</label>
        <select name="payment_mode">
          <option value="">Select Mode</option>
          <option value="CASH">CASH</option>
          <option value="ONLINE">ONLINE</option>
          <option value="CHEQUE">CHEQUE</option>
        </select>
      </div>
      <div>
        <label>Paid By</label>
        <input type="text" name="paid_by" placeholder="Person name" />
      </div>
      <div>
        <label>Bill (Image/PDF)</label>
        <input type="file" name="bill" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf" />
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:12px;">
      <a href="{{ url_for('expenses') }}" class="btn" style="width:auto; text-decoration:none; padding:10px 14px; background:linear-gradient(135deg,#64748b 0%, #475569 100%);">Cancel</a>
      <button type="submit" style="width:auto; padding:10px 14px;">Save Expense</button>
    </div>
  </form>
</div>
{% endblock %}
